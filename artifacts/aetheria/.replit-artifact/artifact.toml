kind = "web"
previewPath = "/"
title = "AETHERIA — Tienda Online"
version = "1.0.0"
id = "artifacts/aetheria"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22963

[services.development]
run = "pnpm --filter @workspace/aetheria run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aetheria", "run", "build" ]
publicDir = "artifacts/aetheria/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22963"
BASE_PATH = "/"
